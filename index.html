<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Is anyone planning for Palm Cove’s future? Three taps.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f2f7f5;--panel:#ffffff;--ink:#14302e;--mute:#4d6663;--line:#cfe0dc;--teal:#0f7b7b;--teal-ink:#ffffff;--sand:#efe3c6;--amber:#9a5410;--ok:#1d6b45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1e;--panel:#17302e;--ink:#e6f1ee;--mute:#a4bdb9;--line:#2c4a46;--teal:#4cc3c0;--teal-ink:#0b1a19;--sand:#3a3524;--amber:#e4a560;--ok:#7fd1a2}}
:root[data-theme="dark"]{--bg:#0f1f1e;--panel:#17302e;--ink:#e6f1ee;--mute:#a4bdb9;--line:#2c4a46;--teal:#4cc3c0;--teal-ink:#0b1a19;--sand:#3a3524;--amber:#e4a560;--ok:#7fd1a2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Figtree,system-ui,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 56px}
h1,h2{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:2rem}
h2{font-size:1.6rem;margin:6px 0 14px}
h3{font-size:1rem;margin:18px 0 6px}
.sub{color:var(--mute);margin:8px 0 0}
.path{display:flex;gap:6px;margin:26px 0 22px;padding:0;list-style:none}
.path li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.path li.done{background:var(--teal)}
.path li.now{background:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px}
.step{color:var(--mute);font-size:.9rem;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0}
button{font:inherit;font-weight:600;border-radius:10px;border:2px solid var(--teal);background:transparent;color:var(--ink);padding:10px 20px;cursor:pointer;min-height:44px}
button.main{background:var(--teal);color:var(--teal-ink)}
button.quiet{border-color:var(--line);font-weight:400}
button:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.res{margin:18px 0 0;padding:14px 16px;border-radius:10px;background:var(--sand)}
.res.ok{border-left:5px solid var(--ok)}
.res.diff{border-left:5px solid var(--amber)}
.res p{margin:0 0 6px}
details{margin:16px 0 0;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
ul{padding-left:20px;margin:8px 0}
li{margin:5px 0}
.not{color:var(--mute);font-size:.95rem}
.chain li{margin:8px 0}
.flag{color:var(--amber);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.foot{color:var(--mute);font-size:.85rem;margin-top:26px}
.back{margin-top:16px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}

.fig{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{color:var(--mute);font-size:.85rem;margin:6px 0 0}
svg text{fill:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:11px}
svg .m{fill:var(--mute)}
input[type=range]{width:100%;accent-color:var(--teal);min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.two div{padding:12px;border-radius:10px;border:1px solid var(--line)}
.two .d{background:var(--sand)}
.two h4{margin:0 0 6px;font-size:.95rem}
.two ul{margin:0;padding-left:18px;font-size:.92rem}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.cta{margin-top:22px;padding:18px;border-radius:12px;background:var(--teal);color:var(--teal-ink)}
.cta h3{margin:0 0 8px;font-family:Newsreader,Georgia,serif;font-size:1.35rem}
.cta p{margin:0 0 10px}
.cta a.b,.cta button.b{display:inline-block;font:inherit;font-weight:600;text-decoration:none;border-radius:10px;padding:10px 20px;min-height:44px;margin:4px 8px 0 0;border:2px solid var(--teal-ink);cursor:pointer}
.cta a.main{background:var(--teal-ink);color:var(--teal)}
.cta .b:not(.main){background:transparent;color:var(--teal-ink)}

.hero{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:18px 0 0}
.big{font-family:Newsreader,Georgia,serif;font-size:1.2rem;line-height:1.35;margin:12px 0 0}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:0 22px;margin:14px 2px 0;font-size:.95rem}
.strip a,.strip button{display:inline-flex;align-items:center;color:var(--teal);font:inherit;font-weight:600;line-height:1.2;background:none;border:0;padding:0;margin:0;min-height:44px;cursor:pointer;text-decoration:underline}
.lnk{color:var(--teal);font-weight:600}
.cta button.b{background:transparent;color:var(--teal-ink)}
</style>
</head>
<body>

{q:"Do locals and visitors want the same things from Palm Cove?",exp:"yes",
v:"Yes. Locals and visitors both put protecting village character first, then parking, traffic and pedestrian safety.",
n:"92% of visitors and 95% of locals chose village character (PCA survey, 403 responses).",
ev:["Parking, traffic and pedestrian safety, taken together: 82% of visitors and 77% of locals.","Council’s 2021/22 community engagement, which drew mainly locals, points the same way: about 95% wanted to preserve the area’s character and natural beauty.","Growth is not opposed, but it should support local business without changing the village."],
not:""},
{q:"Is there a funded plan, and has anyone checked the cumulative effect of all the new developments added together?",exp:"no",
v:"No. Council’s Palm Cove Streetscape &amp; Landscape Master Plan sets principles for public spaces but has no funding or timetable, and each development is checked on its own. Nobody has assessed their cumulative effect.",
n:"The Palm Cove Streetscape &amp; Landscape Master Plan sets no timeframes, costs or responsible owner.",
ev:["The Palm Cove Streetscape &amp; Landscape Master Plan (2022) is approved by Council but is a guide, not a binding plan. It does not cover private development, and it sets no timeframes, costs or responsible owner.","Each development application is assessed one at a time against the planning scheme (CairnsPlan), so their cumulative effect on traffic, parking and pedestrian safety is not assessed. The scheme has no Palm Cove local plan with traffic or parking rules for the village as a whole.","PCA’s own traffic model is a first attempt, not an adopted assessment. It invites Council or the State to replace it with a proper check."],
not:""},
